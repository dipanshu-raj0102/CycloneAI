[project]
name = "cycloneai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dipanshu Raj", email = "dipanshuraj0102@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.12",
    "diagnostics>=0.2.4",
    "fastparquet>=2026.9.0",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tensorflow[and-cuda]>=2.21.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.0",
    "urllib3>=2.8.0",
    "xarray>=2026.9.0",
]

[project.scripts]
cycloneai = "cycloneai:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
